<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Uploads · Creatorgen Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 44px; max-width: none; margin-bottom: 8px; }
    .login { display: flex; gap: 10px; margin: 24px 0; flex-wrap: wrap; }
    .login input { font: 15px var(--sans); padding: 11px 14px; border: 1px solid var(--line-2); border-radius: 9px; min-width: 280px; }
    .summary { display: flex; gap: 40px; margin: 8px 0 24px; flex-wrap: wrap; }
    .summary b { display: block; font: 500 28px var(--sans); }
    .summary span { color: var(--muted); font-size: 14px; }
    table.list { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .list th, .list td { text-align: left; padding: 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
    .list th { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--well); }
    .list video { width: 180px; aspect-ratio: 16/10; background: #0f1411; border-radius: 6px; display: block; }
    .list .score { font: 400 30px/1 var(--serif); }
    .status { font: 12px var(--mono); padding: 3px 7px; border-radius: 5px; background: var(--well); }
    .status.error { background: var(--rust-soft); color: #8a3412; }
    .status.done { background: var(--accent-soft); color: var(--accent); }
    .muted { color: var(--muted); font-size: 12.5px; }
    .name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow"><span>Admin</span> Every comparison people have run</p>
    <h1>Uploads</h1>
    <form class="login" id="login">
      <input type="password" id="key" placeholder="Admin key (ADMIN_KEY from your Modal secret)" autocomplete="current-password" />
      <button class="btn-primary" type="submit">Load</button>
      <a class="btn-ghost" id="csv" href="#" hidden>Download CSV</a>
    </form>
    <p class="form-error" id="err" hidden></p>
    <div class="summary" id="summary"></div>
    <div class="table-wrap"><table class="list" id="list" hidden></table></div>
  </div>
  <script src="config.js"></script>
  <script>
    const CFG = window.APP_CONFIG || {};
    const API = (CFG.API_URL || "").replace(/\/$/, "");
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let rows = [];
    try { $("#key").value = localStorage.getItem("adminKey") || ""; } catch (_) {}

    $("#login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const key = $("#key").value.trim();
      try { localStorage.setItem("adminKey", key); } catch (_) {}
      $("#err").hidden = true;
      try {
        const res = await fetch(`${API}/admin/comparisons?limit=200`, { headers: { "x-admin-key": key } });
        if (!res.ok) throw new Error(res.status === 401 ? "Wrong admin key." : `Error ${res.status}`);
        rows = await res.json();
        render();
      } catch (err) {
        $("#err").textContent = API ? err.message : "Set API_URL in config.js first.";
        $("#err").hidden = false;
      }
    });

    function render() {
      const done = rows.filter((r) => r.status === "done");
      const avg = done.length ? done.reduce((s, r) => s + (r.overall_score || 0), 0) / done.length : 0;
      const visitors = new Set(rows.map((r) => r.ip_hash)).size;
      $("#summary").innerHTML = `
        <div><b>${rows.length}</b><span>comparisons</span></div>
        <div><b>${visitors}</b><span>unique visitors</span></div>
        <div><b>${done.filter((r) => r.overall_score >= 0.8).length}</b><span>likely matches</span></div>
        <div><b>${Math.round(avg * 100)}%</b><span>average score</span></div>
        <div><b>${rows.filter((r) => r.status === "error").length}</b><span>errors</span></div>`;
      $("#list").hidden = false;
      $("#list").innerHTML = `<tr><th>When</th><th>Video A</th><th>Video B</th><th>Score</th><th>Tests</th><th>Body models</th><th>User</th></tr>` +
        rows.map((r) => `<tr>
          <td>${new Date(r.created_at).toLocaleString()}<br><span class="status ${r.status}">${esc(r.status)}</span>
            ${r.status === "done" ? `<br><a class="muted" href="./?id=${r.id}" target="_blank">open result ↗</a>` : ""}
            ${r.error ? `<br><span class="muted">${esc(r.error)}</span>` : ""}</td>
          <td>${r.video_a_url ? `<video src="${r.video_a_url}" controls preload="none"></video>` : ""}<div class="name" title="${esc(r.video_a_name)}">${esc(r.video_a_name)}</div><span class="muted">${(r.video_a_duration || 0).toFixed(1)} s · ${((r.video_a_size || 0) / 1048576).toFixed(1)} MB</span></td>
          <td>${r.video_b_url ? `<video src="${r.video_b_url}" controls preload="none"></video>` : ""}<div class="name" title="${esc(r.video_b_name)}">${esc(r.video_b_name)}</div><span class="muted">${(r.video_b_duration || 0).toFixed(1)} s · ${((r.video_b_size || 0) / 1048576).toFixed(1)} MB</span></td>
          <td>${r.overall_score != null ? `<span class="score">${Math.round(r.overall_score * 100)}%</span><br><span class="muted">${esc(r.verdict)}${r.mirrored ? " · mirrored" : ""}</span>` : "–"}</td>
          <td class="muted">${r.tests ? ["body", "scene", "script"].map((k) => `${k === r.tests.driver ? "<b>" : ""}${k} ${r.tests[k] && r.tests[k].score != null ? Math.round(r.tests[k].score * 100) : "–"}${k === r.tests.driver ? "</b>" : ""}`).join("<br>") : ""}</td>
          <td class="muted">${r.model_scores ? Object.entries(r.model_scores).map(([k, v]) => `${k} ${Math.round(v * 100)}`).join("<br>") : ""}</td>
          <td class="muted">${r.user_email ? `<b>${esc(r.user_email)}</b> · ${esc(r.user_plan || "free")}<br>` : ""}${esc((r.ip_hash || "").slice(0, 8))}<br>${esc((r.user_agent || "").slice(0, 40))}</td>
        </tr>`).join("");
      const csv = [["created_at","status","score","strongest_test","body","scene","script","verdict","mirrored","video_a","video_b","a_seconds","b_seconds","visitor"].join(",")]
        .concat(rows.map((r) => [r.created_at, r.status, r.overall_score ?? "", (r.tests || {}).driver ?? "", ...["body", "scene", "script"].map((k) => ((r.tests || {})[k] || {}).score ?? ""), r.verdict ?? "", r.mirrored ?? "", r.video_a_name, r.video_b_name, r.video_a_duration ?? "", r.video_b_duration ?? "", r.ip_hash].map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")));
      $("#csv").href = URL.createObjectURL(new Blob([csv.join("\n")], { type: "text/csv" }));
      $("#csv").download = "comparisons.csv";
      $("#csv").hidden = false;
    }
  </script>
</body>
</html>
